services:
    # === Camada 1: Infraestrutura (sem dependências) ===
    postgres-users:
        image: postgres:16-alpine
        container_name: postgres-users
        ports:
            - '5432:5432'
        environment:
            - POSTGRES_USER=user_service
            - POSTGRES_PASSWORD=user_service_pass
            - POSTGRES_DB=users_db
        volumes:
            - postgres_users_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user_service -d users_db']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-orders:
        image: postgres:16-alpine
        container_name: postgres-orders
        ports:
            - '5433:5432'
        environment:
            - POSTGRES_USER=order_service
            - POSTGRES_PASSWORD=order_service_pass
            - POSTGRES_DB=orders_db
        volumes:
            - postgres_orders_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U order_service -d orders_db']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-payments:
        image: postgres:16-alpine
        container_name: postgres-payments
        ports:
            - '5434:5432'
        environment:
            - POSTGRES_USER=payment_service
            - POSTGRES_PASSWORD=payment_service_pass
            - POSTGRES_DB=payments_db
        volumes:
            - postgres_payments_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U payment_service -d payments_db']
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:4.2.3-management
        container_name: rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # === Camada 2: Serviços de domínio (dependem da infraestrutura) ===
    user-service:
        build:
            context: .
            dockerfile: apps/user-service/Dockerfile
        container_name: user-service
        ports:
            - '3001:3001'
        depends_on:
            - postgres-users
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3001
            - DB_HOST=postgres-users
            - DB_PORT=5432
            - DB_USERNAME=user_service
            - DB_PASSWORD=user_service_pass
            - DB_DATABASE=users_db
            - SERVICE_NAME=user-service
            - OTEL_SERVICE_NAME=user-service
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
            - OTEL_PROPAGATORS=tracecontext,baggage

    order-service:
        build:
            context: .
            dockerfile: apps/order-service/Dockerfile
        container_name: order-service
        ports:
            - '3002:3002'
        depends_on:
            - postgres-orders
            - rabbitmq
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3002
            - DB_HOST=postgres-orders
            - DB_PORT=5432
            - DB_USERNAME=order_service
            - DB_PASSWORD=order_service_pass
            - DB_DATABASE=orders_db
            - RMQ_URL=amqp://rabbitmq:5672
            - SERVICE_NAME=order-service
            - OTEL_SERVICE_NAME=order-service
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
            - OTEL_PROPAGATORS=tracecontext,baggage
            - RABBITMQ_MGMT_URL=http://rabbitmq:15672

    payment-service:
        build:
            context: .
            dockerfile: apps/payment-service/Dockerfile
        container_name: payment-service
        ports:
            - '3003:3003'
        depends_on:
            - postgres-payments
            - rabbitmq
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3003
            - DB_HOST=postgres-payments
            - DB_PORT=5432
            - DB_USERNAME=payment_service
            - DB_PASSWORD=payment_service_pass
            - DB_DATABASE=payments_db
            - RMQ_URL=amqp://rabbitmq:5672
            - SERVICE_NAME=payment-service
            - OTEL_SERVICE_NAME=payment-service
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
            - OTEL_PROPAGATORS=tracecontext,baggage
            - RABBITMQ_MGMT_URL=http://rabbitmq:15672

    # === Camada 3: Gateway (ponto de entrada) ===
    api-gateway:
        build:
            context: .
            dockerfile: apps/api-gateway/Dockerfile
        container_name: api-gateway
        ports:
            - '3000:3000'
        depends_on:
            - user-service
            - order-service
            - payment-service
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3000
            - USER_SERVICE_URL=http://user-service:3001
            - ORDER_SERVICE_URL=http://order-service:3002
            - PAYMENT_SERVICE_URL=http://payment-service:3003
            - SERVICE_NAME=api-gateway
            - OTEL_SERVICE_NAME=api-gateway
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
            - OTEL_PROPAGATORS=tracecontext,baggage

    # === Camada 4: Observabilidade ===
    prometheus:
        image: prom/prometheus:v2.53.0
        container_name: prometheus
        ports:
            - '9090:9090'
        volumes:
            - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
            - '--web.enable-remote-write-receiver'
        depends_on:
            - api-gateway
            - order-service
            - payment-service
            - user-service

    grafana:
        image: grafana/grafana:11.1.0
        container_name: grafana
        ports:
            - '3100:3000'
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
        volumes:
            - grafana_data:/var/lib/grafana
            - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus
            - loki
            - tempo

    # === Camada 5: Telemetria distribuída ===
    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        container_name: otel-collector
        ports:
            - '4317:4317' # OTLP gRPC
            - '4318:4318' # OTLP HTTP
            - '8888:8888' # Métricas internas do collector
        volumes:
            - ./infra/otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
        depends_on:
            - prometheus
            - loki
            - tempo

    tempo:
        image: grafana/tempo:2.6.1
        container_name: tempo
        command: ['-config.file=/etc/tempo.yml']
        ports:
            - '3200:3200' # Tempo HTTP API / UI
        volumes:
            - ./infra/tempo/tempo.yml:/etc/tempo.yml:ro
            - tempo_data:/var/tempo

    loki:
        image: grafana/loki:latest
        container_name: loki
        ports:
            - '3110:3100' # Loki HTTP API (3110 evita conflito com grafana em 3100)
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki

volumes:
    postgres_users_data:
    postgres_orders_data:
    postgres_payments_data:
    rabbitmq_data:
    prometheus_data:
    grafana_data:
    tempo_data:
    loki_data:
