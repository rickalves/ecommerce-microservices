services:
    api-gateway:
        build:
            context: .
            dockerfile: apps/api-gateway/Dockerfile
        container_name: api-gateway
        ports:
            - '3000:3000'
        depends_on:
            - user-service
            - order-service
            - payment-service
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3000
            - USER_SERVICE_URL=http://user-service:3001
            - ORDER_SERVICE_URL=http://order-service:3002
            - PAYMENT_SERVICE_URL=http://payment-service:3003

    user-service:
        build:
            context: .
            dockerfile: apps/user-service/Dockerfile
        container_name: user-service
        ports:
            - '3001:3001'
        depends_on:
            - postgres-users
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3001
            - DB_HOST=postgres-users
            - DB_PORT=5432
            - DB_USERNAME=user_service
            - DB_PASSWORD=user_service_pass
            - DB_DATABASE=users_db

    order-service:
        build:
            context: .
            dockerfile: apps/order-service/Dockerfile
        container_name: order-service
        ports:
            - '3002:3002'
        depends_on:
            - postgres-orders
            - rabbitmq
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3002
            - DB_HOST=postgres-orders
            - DB_PORT=5432
            - DB_USERNAME=order_service
            - DB_PASSWORD=order_service_pass
            - DB_DATABASE=orders_db
            - RMQ_URL=amqp://rabbitmq:5672

    payment-service:
        build:
            context: .
            dockerfile: apps/payment-service/Dockerfile
        container_name: payment-service
        ports:
            - '3003:3003'
        depends_on:
            - postgres-payments
            - rabbitmq
        environment:
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3003
            - DB_HOST=postgres-payments
            - DB_PORT=5432
            - DB_USERNAME=payment_service
            - DB_PASSWORD=payment_service_pass
            - DB_DATABASE=payments_db
            - RMQ_URL=amqp://rabbitmq:5672

    postgres-users:
        image: postgres:16-alpine
        container_name: postgres-users
        ports:
            - '5432:5432'
        environment:
            - POSTGRES_USER=user_service
            - POSTGRES_PASSWORD=user_service_pass
            - POSTGRES_DB=users_db
        volumes:
            - postgres_users_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user_service']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-orders:
        image: postgres:16-alpine
        container_name: postgres-orders
        ports:
            - '5433:5432'
        environment:
            - POSTGRES_USER=order_service
            - POSTGRES_PASSWORD=order_service_pass
            - POSTGRES_DB=orders_db
        volumes:
            - postgres_orders_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U order_service']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-payments:
        image: postgres:16-alpine
        container_name: postgres-payments
        ports:
            - '5434:5432'
        environment:
            - POSTGRES_USER=payment_service
            - POSTGRES_PASSWORD=payment_service_pass
            - POSTGRES_DB=payments_db
        volumes:
            - postgres_payments_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U payment_service']
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_users_data:
    postgres_orders_data:
    postgres_payments_data:
    rabbitmq_data:
