receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

processors:
    batch:
        timeout: 5s
        send_batch_size: 512
    memory_limiter:
        check_interval: 1s
        limit_mib: 256

exporters:
    otlp_grpc/tempo:
        endpoint: tempo:4317
        tls:
            insecure: true
    prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
    otlp_http/loki:
        endpoint: http://loki:3100/otlp
        tls:
            insecure: true
    debug:
        verbosity: basic

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_grpc/tempo]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite]
        logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http/loki]
