apiVersion: 1

datasources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
      access: proxy
      isDefault: false
      jsonData:
          maxLines: 1000
          derivedFields:
              - name: TraceID
                matcherRegex: '"traceId":"(\w+)"'
                url: '${__value.raw}'
                datasourceUid: tempo
                urlDisplayLabel: 'View Trace'
